# The two commands CONTRIBUTING.md requires before a pull request, run where a
# reviewer can see them. A fork PR gets the same gate as a branch PR, which is
# the point: the contributor does not have to be trusted for the check to mean
# something.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# A force-push to a PR branch supersedes the run it interrupted.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# This repository holds live OAuth refresh tokens. The job reads the tree and
# needs nothing else, so it is granted nothing else.
permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          # The floor in CONTRIBUTING.md. Pinned rather than `latest` so a Bun
          # release cannot change what green means without a commit saying so.
          bun-version: 1.3.11

      # --frozen-lockfile so bun.lock is the only thing deciding what installs.
      # bunfig.toml sets a seven-day release-age floor for the same reason, and
      # resolving afresh here would route around it.
      - run: bun install --frozen-lockfile

      - run: bun test
      - run: bun run typecheck

      # The third command, and the one that was written down without being run.
      #
      # `SECURITY.md` has claimed a lockfile CVE check since the first release
      # and the script behind it was `bun pm scan`, which does nothing at all
      # without `[install.security] scanner` configured in `bunfig.toml` — it
      # prints how to configure one and exits zero. So a project that holds live
      # OAuth refresh tokens had a supply-chain control that was documented,
      # scripted, and inert.
      #
      # `bun audit` needs no scanner package: it resolves the lockfile against
      # npm's advisory database directly. Blocking rather than advisory, because
      # a security check nobody has to act on is the state this replaces. If a
      # transitive advisory with no fix available ever holds up unrelated work,
      # the lever is `--audit-level`, not deleting the step.
      - run: bun run audit
