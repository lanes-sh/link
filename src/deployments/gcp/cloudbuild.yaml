# Cloud Build config for the deployed target's image.
#
# It exists so `gcloud builds submit` can name a Dockerfile that is not at the
# context root — `--tag` alone always builds `./Dockerfile`, and moving the
# Dockerfile to the repository root to satisfy that would put deployment
# machinery in front of everyone who only ever runs locally.
#
# Invoked by `lanes link deploy`, which supplies _IMAGE:
#
#   gcloud builds submit \
#     --config src/deployments/gcp/cloudbuild.yaml \
#     --substitutions _IMAGE=<region>-docker.pkg.dev/<project>/lanes-link/<service>:<tag> .
#
# The build context is the repository root, and `.dockerignore` there decides
# what reaches the builder. `data/` must not — see the note in that file.

steps:
  # Pinned by digest with the tag beside it, for the reason the Dockerfile states
  # at length: a tag is a pointer its publisher can move, and this step builds the
  # image that holds live OAuth refresh tokens. Unpinned it was not even a tag —
  # a bare name resolves to `latest`, in a `gcr.io/cloud-builders/*` namespace
  # Google no longer adds to, so this pins onto something already still rather
  # than something current. That is worth saying rather than implying the builder
  # moves.
  #
  # To bump:
  #   TOKEN=$(curl -fsSL "https://gcr.io/v2/token?scope=repository:cloud-builders/docker:pull&service=gcr.io" \
  #     | sed -E 's/.*"token":"([^"]+)".*/\1/')
  #   curl -fsSL -H "Authorization: Bearer $TOKEN" https://gcr.io/v2/cloud-builders/docker/tags/list
  - name: gcr.io/cloud-builders/docker@sha256:dccbdf9b7877dc1b66427d769a55fe9d82c21655a88301e5eba3d0754c76d146  # 20.10.24
    args:
      - build
      - --file
      - src/deployments/gcp/Dockerfile
      - --tag
      - ${_IMAGE}
      - .

images:
  - ${_IMAGE}

options:
  logging: CLOUD_LOGGING_ONLY
