<title>How an agent reaches an account through Lanes Link</title>
<desc>Three MCP clients, Claude, ChatGPT, and any other, converge on a single endpoint you run yourself on your own machine or your own cloud. Inside that endpoint sit the profiles it serves: Work, holding Gmail, Calendar, and Docs, and Personal, holding Gmail, Memory, and Skills.</desc>
